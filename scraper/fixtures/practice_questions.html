  <div class="question">
    <p class="question-text">What is the SI unit of force?</p>
    <ul class="options">
      <li>Joule</li>
      <li>Newton</li>
      <li>Watt</li>
      <li>Pascal</li>
    </ul>
    <span class="answer">Newton</span>
  </div>
  <div class="question">
    <p class="question-text">What is the acceleration due to gravity on Earth (approx)?</p>
    <ul class="options">
      <li>4.9 m/s²</li>
      <li>9.8 m/s²</li>
      <li>19.6 m/s²</li>
      <li>1 m/s²</li>
    </ul>
    <span class="answer">9.8 m/s²</span>
  </div>
